03-4d48-aadd-3356c59c0887"]}]}},{"source":{"data":"Feature: Location-Room Integration\n    In order to ensure proper hierarchical relationships\n    As an administrator\n    I need to verify location and room integrations work correctly\n\n    Background:\n        Given I clean up all existing test data\n\n    Scenario: Complete location-room hierarchy workflow\n        Given I create the following locations\n        | location_name              | location_key | address                |\n        | North Shore Medical Center | NSMC         | 123 Medical Drive      |\n        | Downtown Clinic            | DTC          | 789 Downtown Street    |\n        When I retrieve the list of locations\n        Then I should see 2 locations in the response\n        \n        When I create the following rooms for these locations\n        | room_name           | room_number | location_name              | capacity |\n        | Consultation Room 1 | 101         | North Shore Medical Center | 2        |\n        | Consultation Room 2 | 102         | North Shore Medical Center | 2        |\n        | Surgery Room        | 201         | North Shore Medical Center | 4        |\n        | General Room        | 301         | Downtown Clinic            | 1        |\n        Then all rooms should be created successfully\n        \n        When I retrieve rooms for location \"North Shore Medical Center\"\n        Then I should see 3 rooms for that location\n        And the rooms should include \"Consultation Room 1\", \"Consultation Room 2\", and \"Surgery Room\"\n        \n        When I retrieve rooms for location \"Downtown Clinic\"\n        Then I should see 1 room for that location\n        And the rooms should include \"General Room\"\n        \n        When I retrieve the complete list of rooms\n        Then I should see 4 rooms total\n        And each room should have correct location information\n\n    Scenario: Referential integrity - cannot delete location with rooms\n        Given I create the following locations\n        | location_name     | location_key | address            |\n        | Protected Location| PROT_LOC     | 456 Protected Ave  |\n        And I create the following rooms\n        | room_name      | room_number | location_name      | capacity |\n        | Protected Room | P001        | Protected Location | 1        |\n        When I attempt to delete location \"Protected Location\"\n        Then the deletion should fail due to existing rooms\n        And the error should contain \"cannot delete location with existing rooms\"\n        \n        When I delete room \"Protected Room\"\n        Then the room should be successfully deleted\n        When I delete location \"Protected Location\"\n        Then the location should be successfully deleted\n\n    Scenario: Location update affects room relationships\n        Given I create the following locations\n        | location_name      | location_key | address             |\n        | Original Name      | ORIG_NAME    | 123 Original Street |\n        And I create the following rooms\n        | room_name    | room_number | location_name | capacity |\n        | Linked Room  | L001        | Original Name | 2        |\n        When I update location \"Original Name\" with location_name \"Updated Name\"\n        Then the location should be successfully updated\n        \n        When I get details for room \"Linked Room\"\n        Then the room should have location_name \"Updated Name\"\n        And the room should maintain its other properties\n\n    Scenario: Bulk operations and data consistency\n        Given I create the following locations\n        | location_name | location_key | address           |\n        | Bulk Test 1   | BULK_1       | 111 Bulk Street   |\n        | Bulk Test 2   | BULK_2       | 222 Bulk Avenue   |\n        | Bulk Test 3   | BULK_3       | 333 Bulk Drive    |\n        When I create multiple rooms for each location\n        | room_name  | room_number | location_name | capacity |\n        | Room 1A    | 1A          | Bulk Test 1   | 1        |\n        | Room 1B    | 1B          | Bulk Test 1   | 2        |\n        | Room 2A    | 2A          | Bulk Test 2   | 1        |\n        | Room 2B    | 2B          | Bulk Test 2   | 2        |\n        | Room 3A    | 3A          | Bulk Test 3   | 1        |\n        | Room 3B    | 3B          | Bulk Test 3   | 2        |\n        Then all rooms should be created successfully\n        \n        When I retrieve rooms for each location\n        Then \"Bulk Test 1\" should have 2 rooms\n        And \"Bulk Test 2\" should have 2 rooms\n        And \"Bulk Test 3\" should have 2 rooms\n        \n        When I delete all rooms for \"Bulk Test 2\"\n        Then \"Bulk Test 2\" should have 0 rooms\n        And other locations should maintain their rooms\n        \n        When I delete location \"Bulk Test 2\"\n        Then the location should be successfully deleted\n        And other locations should remain unaffected\n\n    Scenario: Room transfer between locations\n        Given I create the following locations\n        | location_name | location_key | address              |\n        | Source Loc    | SRC_LOC      | 111 Source Street    |\n        | Target Loc    | TGT_LOC      | 222 Target Avenue    |\n        And I create the following rooms\n        | room_name       | room_number | location_name | capacity |\n        | Transferable    | T001        | Source Loc    | 3        |\n        | Source Native   | S001        | Source Loc    | 1        |\n        | Target Native   | T002        | Target Loc    | 2        |\n        \n        When I retrieve rooms for location \"Source Loc\"\n        Then I should see 2 rooms for that location\n        When I retrieve rooms for location \"Target Loc\"\n        Then I should see 1 room for that location\n        \n        When I update room \"Transferable\" to location \"Target Loc\"\n        Then the room should be successfully updated\n        \n        When I retrieve rooms for location \"Source Loc\"\n        Then I should see 1 room for that location\n        And the rooms should include \"Source Native\"\n        When I retrieve rooms for location \"Target Loc\"\n        Then I should see 2 rooms for that location\n        And the rooms should include \"Transferable\" and \"Target Native\"\n\n    Scenario: Clean up all integration test data\n        When I delete all test rooms from integration tests\n        And I delete all test locations from integration tests\n        Then all integration test data should be cleaned up\n","uri":"src\/features\/location-room-integration.feature","mediaType":"text\/x.cucumber.gherkin+plain"}},{"gherkinDocument":{"feature":{"tags":[],"location":{"line":1,"column":1},"language":"en","keyword":"Feature","name":"Location-Room Integration","description":"    In order to ensure proper hierarchical relationships\n    As an administrator\n    I need to verify location and room integrations work correctly","children":[{"background":{"id":"bb8f1343-3d7c-425f-9fde-53e69a8d6933","location":{"line":6,"column":5},"keyword":"Background","name":"","description":"","steps":[{"id":"de643ad5-f93e-4670-bb8a-aa9a7d9e2521","location":{"line":7,"column":9},"keyword":"Given ","keywordType":"Context","text":"I clean up all existing test data"}]}},{"scenario":{"id":"9331d3ba-fa68-420f-82ee-da4d34d68a69","tags":[],"location":{"line":9,"column":5},"keyword":"Scenario","name":"Complete location-room hierarchy workflow","description":"","steps":[{"id":"7ca882c0-ba99-4d27-9d9a-c63ab1ea5663","location":{"line":10,"column":9},"keyword":"Given ","keywordType":"Context","text":"I create the following locations","dataTable":{"location":{"line":11,"column":9},"rows":[{"id":"d185a425-9053-496f-9c8e-a10f79976bad","location":{"line":11,"column":9},"cells":[{"location":{"line":11,"column":11},"value":"location_name"},{"location":{"line":11,"column":40},"value":"location_key"},{"location":{"line":11,"co ation Feature\n    In order to manage medical center locations\n    As an administrator\n    I need to be able to create, read, update and delete locations\n\n    Scenario: Complete location management lifecycle\n        Given I create the following locations\n        | location_name              | location_key | address                |\n        | North Shore Medical Center | NSMC         | 123 Medical Drive      |\n        | City Central Clinic        | CCC          | 456 Central Avenue     |\n        When I retrieve the list of locations\n        Then I should see at least 2 locations in the response\n        And the locations should include \"North Shore Medical Center\" and \"City Central Clinic\"\n        \n        When I get details for location \"North Shore Medical Center\"\n        Then I should receive location details with correct information\n        And the location should have location_name \"North Shore Medical Center\"\n        And the location should have location_key \"NSMC\"\n        And the location should have address \"123 Medical Drive\"\n        \n        When I update location \"North Shore Medical Center\" with the following data\n        | location_name                     | location_key | address                    |\n        | North Shore Medical Center - Main | NSMC_MAIN    | 123 Medical Drive, Suite A |\n        Then the location should be successfully updated\n        And the location's location_name should be \"North Shore Medical Center - Main\"\n        And the location's location_key should be \"NSMC_MAIN\"\n        And the location should have address \"123 Medical Drive, Suite A\"\n        \n        When I delete location \"City Central Clinic\"\n        Then the location should be successfully deleted\n        When I retrieve the list of locations\n        Then I should not see \"City Central Clinic\" in the locations list\n        \n    Scenario: Location validation requirements\n        When I attempt to create a location without required fields\n        Then the creation should fail with validation errors\n        And the error should mention required fields \"location_name\" and \"location_key\"\n\n    Scenario: Update location with partial data\n        Given I create the following locations\n        | location_name     | location_key | address            |\n        | Test Location     | TEST_LOC     | 789 Test Street    |\n        When I update location \"Test Location\" with only address \"789 Test Street, Updated\"\n        Then the location should be successfully updated\n        And the location should have address \"789 Test Street, Updated\"\n        And the location's location_name should still be \"Test Location\"\n        And the location's location_key should still be \"TEST_LOC\"\n\n        When I delete location \"Test Location\"\n        Then the location should be successfully deleted\n","uri":"src\/features\/location.feature","mediaType":"text\/x.cucumber.gherkin+plain"}},{"gherkinDocument":{"feature":{"tags":[],"location":{"line":1,"column":1},"language":"en","keyword":"Feature","name":"Location Feature","description":"    In order to manage medical center locations\n    As an administrator\n    I need to be able to create, read, update and delete locations","children":[{"scenario":{"id":"c316ddbf-f475-444f-b13d-2dca2c66ad26","tags":[],"location":{"line":6,"column":5},"keyword":"Scenario","name":"Complete location management lifecycle","description":"","steps":[{"id":"a79a9b69-cb95-48ca-9c8e-6550c68a0678","location":{"line":7,"column":9},"keyword":"Given ","keywordType":"Context","text":"I create the following locations","dataTable":{"location":{"line":8,"column":9},"rows":[{"id":"6ac7e50d-84d3-4989-83bf-306387846a8a","location":{"line":8,"column":9},"cells":[{"location":{"line":8,"column":11},"value":"location_name"},{"location":{"line":8,"column":40},"value":"location_key"},{"location":{"line":8,"column":55},"value":"address"}]},{"id":"79c19b05-f42a-4d64-9a8d-cb9f dation errors","type":"Outcome","astNodeIds":["5efb55e2-5e0c-4b63-9e9b-9bf19c973f86"]},{"id":"29d0c041-4ef8-4224-8f57-9c818a50f723","text":"the error should mention required fields \"location_name\" and \"location_key\"","type":"Outcome","astNodeIds":["3c92a6bb-0a0d-458d-93ce-93146dcf4274"]}]}},{"pickle":{"id":"cfee41e3-389c-4da6-a19b-f4b150939997","uri":"src\/features\/location.feature","astNodeIds":["d3021c8a-5ff9-476e-a904-be3810722ef2"],"tags":[],"name":"Update location with partial data","language":"en","steps":[{"id":"e2ae2eeb-eb8a-4683-840e-18945d2faf20","text":"I create the following locations","type":"Context","argument":{"dataTable":{"rows":[{"cells":[{"value":"location_name"},{"value":"location_key"},{"value":"address"}]},{"cells":[{"value":"Test Location"},{"value":"TEST_LOC"},{"value":"789 Test Street"}]}]}},"astNodeIds":["4d249530-c3fe-460b-ad9d-8dad5d058fa6"]},{"id":"6545685f-4966-4635-9be9-45879a931900","text":"I update location \"Test Location\" with only address \"789 Test Street, Updated\"","type":"Action","astNodeIds":["6f840c56-394e-4093-955e-5194a62f3e4c"]},{"id":"ad39cd68-b475-4349-b443-7fbaebaaa0b9","text":"the location should be successfully updated","type":"Outcome","astNodeIds":["f2a3d6f8-a5d3-4bb9-9df4-4a71d7d22c52"]},{"id":"7ab9ede4-a590-4d7a-a297-98f3bf44c474","text":"the location should have address \"789 Test Street, Updated\"","type":"Outcome","astNodeIds":["097e9cf2-5a82-4826-ad42-f8d035bd82e8"]},{"id":"abb6760b-9c32-4641-97a6-3f4c41c52f53","text":"the location's location_name should still be \"Test Location\"","type":"Outcome","astNodeIds":["21e07746-5a83-4065-bec1-65be5dccc14a"]},{"id":"b03be701-4ad6-4316-8a96-876bfd30c8e8","text":"the location's location_key should still be \"TEST_LOC\"","type":"Outcome","astNodeIds":["484bc1f9-2e2f-4ed1-81c6-84af94fd75f1"]},{"id":"343e9bb3-eddd-4ec1-8cce-46cb497096c3","text":"I delete location \"Test Location\"","type":"Action","astNodeIds":["645452b4-b2a6-4b71-8f14-cbb85da75c83"]},{"id":"24857941-7513-428f-a9b6-4b66213948a8","text":"the location should be successfully deleted","type":"Outcome","astNodeIds":["ffbd2bb4-6f70-4c69-886c-b5eff1996c32"]}]}},{"source":{"data":"Feature: Room Feature\n    In order to manage medical center rooms\n    As an administrator\n    I need to be able to create, read, update and delete rooms\n\n    Scenario: Complete room management lifecycle\n        Given I create the following locations\n        | location_name              | location_key | address                |\n        | North Shore Medical Center | NSMC         | 123 Medical Drive      |\n        | City Central Clinic        | CCC          | 456 Central Avenue     |\n        And I create the following rooms\n        | room_name           | room_number | location_name              | capacity |\n        | Consultation Room A | 101         | North Shore Medical Center | 2        |\n        | Surgery Room B      | 201         | North Shore Medical Center | 4        |\n        | General Room C      | 301         | City Central Clinic        | 1        |\n        When I retrieve the list of rooms\n        Then I should see at least 3 rooms in the response\n        And the rooms should include \"Consultation Room A\", \"Surgery Room B\", and \"General Room C\"\n        \n        When I get details for room \"Consultation Room A\"\n        Then I should receive room details with correct information\n        And the room should have room_name \"Consultation Room A\"\n        And the room should have room_number \"101\"\n        And the room should have location_name \"North Shore Medical Center\"\n        And the room should have capacity 2\n        \n        When I get rooms for location \"North Shore Medical Center\"\n        Then I should see 2 rooms for that location\n        And the rooms should include \"Consultation Room A\" and \"Surgery Room B\"\n        \n        When I update room \"Consultation Room A\" with the following data\n        | room_name                 | room_number | capacity |\n        | Consultation Room A - VIP | 101A        | 3        |\n        Then the room should be successfully updated\n        And the room's room_name should be \"Consultation Room A - VIP\"\n        And the room's room_number should be \"101A\"\n        And the room should have capacity 3\n        \n        When I delete room \"General Room C\"\n        Then the room should be successfully deleted\n        When I retrieve the list of rooms\n        Then I should not see \"General Room C\" in the rooms list\n\n    Scenario: Room validation with location requirements\n        Given I create the following locations\n        | location_name     | location_key | address            |\n        | Test Location     | TEST_LOC     | 789 Test Street    |\n        When I attempt to create a room without required fields\n        Then the creation should fail with validation errors\n        And the error should mention required fields \"room_name\" and \"location_id\"\n        \n        When I attempt to create a room with non-existent location\n        Then the creation should fail with location validation error\n        And the error should contain \"location not found\"\n\n    Scenario: Update room location\n        Given I create the following locations\n        | location_name       | location_key | address              |\n        | Original Location   | ORIG_LOC     | 123 Original Street  |\n        | New Location        | NEW_LOC      | 456 New Avenue       |\n        And I create the following rooms\n        | room_name     | room_number | location_name     | capacity |\n        | Mobile Room   | M001        | Original Location | 1        |\n        When I update room \"Mobile Room\" to location \"New Location\"\n        Then the room should be successfully updated\n        And the room should have location_name \"New Location\"\n        \n        When I get rooms for location \"New Location\"\n        Then I should see 1 room for that location\n        And the rooms should include \"Mobile Room\"\n        \n        When I get rooms for location \"Original Location\"\n        Then I should see 0 rooms for that location\n\n    Scenario: Room capacity defaults and validation\n        Given I create the following locations\n        | location_name     | location_key | address            |\n        | Capacity Test     | CAP_TEST     | 999 Capacity Ave   |\n        When I create a room without specifying capacity\n        | room_name        | room_number | location_name |\n        | Default Capacity | D001        | Capacity Test |\n        Then the room should be created successfully\n        And the room should have capacity 1\n        \n        When I create a room with specific capacity\n        | room_name         | room_number | location_name | capacity |\n        | Large Conference  | L001        | Capacity Test | 20       |\n        Then the room should be created successfully\n        And the room should have capacity 20\n\n    Scenario: Clean up test data\n        When I delete all test rooms\n        And I delete all test locations\n        Then all test data should be cleaned up\n","uri":"src\/features\/room.feature","mediaType":"text\/x.cucumber.gherkin+plain"}},{"gherkinDocument":{"feature":{"tags":[],"location":{"line":1,"column":1},"language":"en","keyword":"Feature","name":"Room Feature","description":"    In order to manage medical center rooms\n    As an administrator\n    I need to be able to create, read, update and delete rooms","children":[{"scenario":{"id":"7716dbad-fdf6-46ca-a9a7-92e8999f8ca1","tags":[],"location":{"line":6,"column":5},"keyword":"Scenario","name":"Complete room management lifecycle","description":"","steps":[{"id":"a26eed41-27e3-4dde-ad76-fd929ad1859b","location":{"line":7,"column":9},"keyword":"Given ","keywordType":"Context","text":"I create the following locations","dataTable":{"location":{"line":8,"column":9},"rows":[{"id":"fc7bdd31-5ebf-44db-86ed-b311ea8adc07","l
